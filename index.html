<!doctype html>
<html lang="nl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streetmasters | Car Detailing &amp; Wrapping</title>
    <meta name="description" content="Car detailing, keramische coating, PPF en wrapping in Houthalen-Helchteren. Ontdek Streetmasters en vraag een offerte op maat voor je wagen aan." />
    <link rel="canonical" href="https://streetmasters.be/" />
    <meta name="robots" content="index,follow" />
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.driesbielen.be/js/pa-9vfdncuI4xvmXvTOW7q8_.js"></script>
    <script>
      window.plausible = window.plausible || function () { (plausible.q = plausible.q || []).push(arguments) };
      plausible.init = plausible.init || function (options) { plausible.o = options || {} };
      plausible.init({
        // Explicit events below avoid duplicate form/link events and private checkout URLs.
        outboundLinks: false,
        fileDownloads: false,
        formSubmissions: false,
        transformRequest(payload) {
          for (const key of ['u', 'r']) {
            if (!payload[key]) continue;
            try {
              const url = new URL(payload[key]);
              url.search = '';
              url.hash = '';
              payload[key] = url.href;
            } catch { payload[key] = ''; }
          }
          return payload;
        }
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
